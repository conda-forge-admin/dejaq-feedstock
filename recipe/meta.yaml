{% set name = "dejaq" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/dejaq-{{ version }}.tar.gz
  sha256: f08c3a65a6b9e6af56ee49bacbe84b519c88e8ac82b28b8a0a0b49b113899b8f

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python
    - setuptools >=42
    - wheel
    - pip
  run:
    - python
    - numpy
    - tqdm
    - posix_ipc  # [unix]
    - cloudpickle
    - psutil

test:
  imports:
    - dejaq
  commands:
    - pip check
  requires:
    - python
    - pip

about:
  home: https://github.com/danionella/dejaq
  summary: Déjà Queue – A fast multiprocessing queue for Python
  license: MIT
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - bjudkewitz
